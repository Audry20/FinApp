<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Finance App - Sign Up</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Custom Fonts & Styles -->
<style data-purpose="custom-typography">
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f0b;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-mono-spaced {
      font-family: 'Space Grotesk', monospace;
      letter-spacing: 0.18em;
    }

    .font-label {
      font-family: monospace, sans-serif;
      letter-spacing: 0.05em;
    }
  </style>
<style data-purpose="custom-effects">
    /* Deep recessed input effect matching neumorphic look in the image */
    .input-recessed {
      background-color: #0c150e;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.75), inset 0 -1px 2px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(22, 45, 26, 0.4);
    }

    .input-recessed:focus-within {
      border-color: rgba(94, 234, 153, 0.3);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8), 0 0 8px rgba(94, 234, 153, 0.1);
    }

    /* Glow effect for the bright green pill button */
    .glow-mint-button {
      background: #73e6a4;
      box-shadow: 0 0 28px rgba(115, 230, 164, 0.55), 0 0 10px rgba(115, 230, 164, 0.35);
      color: #0a1f10;
    }

    .glow-mint-button:hover {
      background: #80f0af;
      box-shadow: 0 0 35px rgba(115, 230, 164, 0.7);
    }

    /* Subtle left graphic wave shape */
    .curved-panel {
      background: radial-gradient(circle at 10% 20%, #1e4526 0%, #0d2112 45%, #07120a 80%);
      clip-path: ellipse(85% 100% at 15% 50%);
    }

    /* Glass highlight arc across the left panel */
    .diagonal-glass-line {
      background: linear-gradient(135deg, rgba(162, 219, 172, 0.18) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 65%);
    }
  </style>
<!-- END: Custom Fonts & Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6 md:p-8 bg-[#080d09]">
<!-- BEGIN: Browser Mockup Frame -->
<main class="w-full max-w-[1240px] aspect-[16/10] min-h-[680px] bg-[#070e08] rounded-2xl overflow-hidden shadow-2xl border border-[#1b2b1e]/60 flex flex-col relative select-none" data-purpose="app-window-frame">
<!-- BEGIN: Browser Top Window Bar -->
<header class="h-10 bg-[#0d160f] border-b border-[#182a1b]/60 flex items-center px-4 justify-between z-20" data-purpose="window-titlebar">
<!-- Window Controls & Navigation -->
<div class="flex items-center space-x-3">
<!-- Traffic lights -->
<div class="flex space-x-2">
<span class="w-3 h-3 rounded-full bg-[#ec6a5e] inline-block"></span>
<span class="w-3 h-3 rounded-full bg-[#f4bf4f] inline-block"></span>
<span class="w-3 h-3 rounded-full bg-[#62c554] inline-block"></span>
</div>
<!-- Browser icons mock -->
<div class="flex items-center space-x-2 text-[#49654e] text-xs ml-3">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<svg class="w-3 h-3 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Center Fake URL Bar -->
<div class="hidden sm:block w-72 md:w-96 h-6 bg-[#060b07] rounded-md border border-[#1a2e1d]/50"></div>
<!-- Right Window Icons -->
<div class="flex items-center space-x-3 text-[#49654e]">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</header>
<!-- END: Browser Top Window Bar -->
<!-- BEGIN: Main Canvas Layout -->
<div class="relative flex-1 grid grid-cols-1 md:grid-cols-12 overflow-hidden bg-[#070e08]" data-purpose="screen-content">
<!-- BEGIN: Left Graphic Section -->
<div class="relative md:col-span-5 h-64 md:h-full flex flex-col justify-end p-8 md:p-14 overflow-hidden" data-purpose="left-brand-panel">
<!-- Abstract Curved Fluid Panel Overlay -->
<div class="absolute inset-0 curved-panel opacity-95 pointer-events-none"></div>
<!-- Sleek Diagonal Glass Refraction Edge -->
<div class="absolute inset-y-0 left-0 right-[-100px] diagonal-glass-line pointer-events-none transform -skew-x-12 origin-top-left"></div>
<!-- Brand Titles positioned at bottom-left exactly as in screenshot -->
<div class="relative z-10 mb-4 md:mb-12">
<h1 class="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-tight text-white mb-2" data-purpose="primary-heading">
            Finance App
          </h1>
<p class="text-lg sm:text-xl font-normal text-[#5a8063]" data-purpose="secondary-subheading">
            Finance App
          </p>
</div>
</div>
<!-- END: Left Graphic Section -->
<!-- BEGIN: Right Form Section -->
<div class="relative md:col-span-7 flex flex-col justify-center items-center md:items-start px-6 sm:px-12 md:pl-16 md:pr-24 py-8 md:py-0 z-10" data-purpose="right-form-panel">
<!-- Form Container with exact max width matching layout proportion -->
<div class="w-full max-w-[430px] space-y-6">
<!-- SIGN UP Header -->
<div class="text-center md:text-left mb-6">
<h2 class="text-3xl sm:text-4xl font-mono-spaced text-white font-medium tracking-[0.22em] text-center w-full" data-purpose="form-title">
              SIGN UP
            </h2>
</div>
<form action="#" class="space-y-4" data-purpose="signup-form" method="POST" onsubmit="event.preventDefault();">
<!-- Name and Surname Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
<!-- Name Input Field -->
<div class="flex flex-col space-y-1.5" data-purpose="input-group-name">
<label class="font-label text-xs text-[#52775a] tracking-wider ml-1" for="name">name</label>
<div class="input-recessed rounded-full px-3.5 py-2.5 flex items-center space-x-2.5 transition">
<!-- User Outline Icon -->
<svg class="w-4 h-4 text-[#44634b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="bg-transparent border-0 p-0 text-sm text-[#7fa386] placeholder-[#38513d] focus:ring-0 focus:outline-none w-full" id="name" name="name" placeholder="your name" type="text">
</div>
</div>
<!-- Surname Input Field -->
<div class="flex flex-col space-y-1.5" data-purpose="input-group-surname">
<label class="font-label text-xs text-[#52775a] tracking-wider ml-1" for="surname">surname</label>
<div class="input-recessed rounded-full px-3.5 py-2.5 flex items-center space-x-2.5 transition">
<!-- User Outline Icon -->
<svg class="w-4 h-4 text-[#44634b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="bg-transparent border-0 p-0 text-sm text-[#7fa386] placeholder-[#38513d] focus:ring-0 focus:outline-none w-full" id="surname" name="surname" placeholder="your surname" type="text">
</div>
</div>
</div>
<!-- Mail Input Field (Full Width) -->
<div class="flex flex-col space-y-1.5 pt-0.5" data-purpose="input-group-mail">
<label class="font-label text-xs text-[#52775a] tracking-wider ml-1" for="mail">mail</label>
<div class="input-recessed rounded-full px-3.5 py-2.5 flex items-center space-x-2.5 transition">
<!-- User Outline Icon as depicted in reference -->
<svg class="w-4 h-4 text-[#44634b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="bg-transparent border-0 p-0 text-sm text-[#7fa386] placeholder-[#38513d] focus:ring-0 focus:outline-none w-full" id="mail" name="mail" placeholder="your mail" type="email">
</div>
</div>
<!-- Password and Confirm Password Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 pt-0.5">
<!-- Password Field -->
<div class="flex flex-col space-y-1.5" data-purpose="input-group-password">
<label class="font-label text-xs text-[#52775a] tracking-wider ml-1" for="password">password</label>
<div class="input-recessed rounded-full px-3.5 py-2.5 flex items-center space-x-2.5 transition">
<!-- Lock Outline Icon -->
<svg class="w-4 h-4 text-[#44634b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="bg-transparent border-0 p-0 text-sm text-[#7fa386] placeholder-[#38513d] focus:ring-0 focus:outline-none w-full tracking-widest" id="password" name="password" placeholder="•••••••••" type="password">
</div>
</div>
<!-- Confirm Password Field (Preserving exact reference prompt label) -->
<div class="flex flex-col space-y-1.5" data-purpose="input-group-confirm-password">
<label class="font-label text-xs text-[#52775a] tracking-wider ml-1 truncate" for="confirm-password">coifnrm your password</label>
<div class="input-recessed rounded-full px-3.5 py-2.5 flex items-center space-x-2.5 transition">
<!-- Lock Outline Icon -->
<svg class="w-4 h-4 text-[#44634b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<input class="bg-transparent border-0 p-0 text-sm text-[#7fa386] placeholder-[#38513d] focus:ring-0 focus:outline-none w-full tracking-widest" id="confirm-password" name="confirm-password" placeholder="•••••••••" type="password">
</div>
</div>
</div>
<!-- Action Buttons Row -->
<div class="pt-5 flex items-center space-x-4" data-purpose="button-actions-row">
<!-- Primary Action: Neon Glowing Log In Button -->
<button class="flex-1 py-3 px-6 rounded-full font-medium text-base glow-mint-button transition duration-200 text-center tracking-normal font-sans" data-purpose="primary-login-button" type="submit">
                log in
              </button>
<!-- Secondary Action: Dark Outlined Google Button -->
<button class="flex-1 py-3 px-6 rounded-full font-medium text-base text-white bg-[#0e1710] border border-[#233c27] hover:border-[#335639] transition duration-200 flex items-center justify-center space-x-2.5" data-purpose="google-auth-button" type="button">
<!-- Google 'G' Symbol in clean vector matching mockup style -->
<svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24">
<path d="M12.24 10.285V13.8h6.772c-.283 1.83-2.126 5.37-6.772 5.37-4.08 0-7.41-3.375-7.41-7.535s3.33-7.535 7.41-7.535c2.32 0 3.87.99 4.76 1.845l3.24-3.12C18.17 1.05 15.42 0 12.24 0 5.61 0 .24 5.37.24 12s5.37 12 12 12c6.93 0 11.53-4.875 11.53-11.73 0-.795-.09-1.395-.19-1.985H12.24z"></path>
</svg>
<span class="tracking-wide">Google</span>
</button>
</div>
<!-- Footer Login Link -->
<div class="pt-4 text-center sm:text-left text-xs font-mono tracking-wide" data-purpose="bottom-redirect-link">
<span class="text-[#65856c]">Already have an accound , </span>
<a class="text-[#51d382] hover:underline font-semibold ml-0.5" href="#login">Login</a>
</div>
</form>
</div>
</div>
<!-- END: Right Form Section -->
</div>
<!-- END: Main Canvas Layout -->
</main>
<!-- END: Browser Mockup Frame -->
</body></html>
