<div class="fixed bottom-6 right-6 max-w-sm bg-[#0e1c10] border border-[#2c5332] text-white p-4 rounded-2xl shadow-2xl transition-all duration-300 flex items-start gap-3 toast-hide z-50 backdrop-blur-md" data-purpose="feedback-toast" id="toast-notification" role="alert">
<div class="w-7 h-7 rounded-full bg-mintNeon/20 border border-mintNeon text-mintNeon flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<div class="flex-1">
<h3 class="text-sm font-semibold text-mintNeon" id="toast-title">Succès</h3>
<p class="text-xs text-slate-300 mt-1 leading-relaxed" id="toast-message">Opération effectuée avec succès.</p>
</div>
<button aria-label="Fermer la notification" class="text-slate-400 hover:text-white transition-colors" id="toast-close" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- END: InteractiveToastNotification -->
<!-- Interactive Logic according to specifications 3.8 -->
<script data-purpose="interaction-handlers">
    // Helper function to display temporary alerts/toasts
    const toast = document.getElementById('toast-notification');
    const toastTitle = document.getElementById('toast-title');
    const toastMessage = document.getElementById('toast-message');
    const toastClose = document.getElementById('toast-close');
    let toastTimeout = null;

    function showNotification(title, message, isSuccess = true) {
      if (toastTimeout) clearTimeout(toastTimeout);
      
      toastTitle.textContent = title;
      toastMessage.textContent = message;

      toast.classList.remove('toast-hide');
      toast.classList.add('toast-show');

      toastTimeout = setTimeout(() => {
        closeNotification();
      }, 4500);
    }

    function closeNotification() {
      toast.classList.remove('toast-show');
      toast.classList.add('toast-hide');
    }

    toastClose.addEventListener('click', closeNotification);

    // Form 1: Profil save
    document.getElementById('profile-info-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const nom = document.getElementById('input-nom').value;
      const prenom = document.getElementById('input-prenom').value;
      showNotification('Modifications Enregistrées', `Les informations du profil pour ${prenom} ${nom} ont été mises à jour avec succès.`);
    });

    // Form 2: Password change
    document.getElementById('security-form').addEventListener('submit', function (e) {
      e.preventDefault();
      showNotification('Sécurité Mise à Jour', 'Votre mot de passe a été modifié avec succès.');
    });

    // Password forgotten handler according to specification section 3.8
    document.getElementById('forgot-password-link').addEventListener('click', function (e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value || 'user@finance.app';
      showNotification(
        'E-mail de Réinitialisation Envoyé', 
        `Un lien de réinitialisation sécurisé avec un token temporaire a été envoyé à ${email}.`
      );
    });
  </script>
