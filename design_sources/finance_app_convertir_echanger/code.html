    const currencies = {
      USD: { code: 'USD', name: 'Dollar américain', symbol: '$', flag: '🇺🇸', balance: 1250.00, walletLabel: 'Portefeuille USD', rateToUSD: 1.0 },
      EUR: { code: 'EUR', name: 'Euro', symbol: '€', flag: '🇪🇺', balance: 32500.00, walletLabel: 'Portefeuille EUR', rateToUSD: 1.058 },
      GBP: { code: 'GBP', name: 'Livre sterling', symbol: '£', flag: '🇬🇧', balance: 3200.00, walletLabel: 'Portefeuille GBP', rateToUSD: 1.265 },
      TRY: { code: 'TRY', name: 'Livre turque', symbol: '₺', flag: '🇹🇷', balance: 85000.00, walletLabel: 'Portefeuille TRY', rateToUSD: 0.0308 }
    };

    let sourceKey = 'USD';
    let targetKey = 'EUR';
    // Exact baseline rate from exchange.jpeg screenshot: 1 USD = 0.9452 EUR
    const exchangeRateUSDToEUR = 0.9452;

    const inputAmount = document.getElementById('input-amount');
    const outputAmount = document.getElementById('output-amount');
    const btnSwap = document.getElementById('btn-swap');
    const rateFormulaText = document.getElementById('rate-formula-text');
    const detailFee = document.getElementById('detail-fee');
    const detailTotal = document.getElementById('detail-total');
    const btnConfirm = document.getElementById('btn-confirm-exchange');
    const toast = document.getElementById('toast');
    const toastDesc = document.getElementById('toast-desc');

    // UI elements for Source
    const srcFlag = document.getElementById('source-flag-badge');
    const srcCode = document.getElementById('source-currency-code');
    const srcBal = document.getElementById('source-balance-val');
    const srcWallet = document.getElementById('source-wallet-label');

    // UI elements for Target
    const tgtFlag = document.getElementById('target-flag-badge');
    const tgtCode = document.getElementById('target-currency-code');
    const tgtBal = document.getElementById('target-balance-val');
    const tgtWallet = document.getElementById('target-wallet-label');

    function formatNumber(num, decimals = 2) {
      return num.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function getRate(from, to) {
      if (from === 'USD' && to === 'EUR') return exchangeRateUSDToEUR;
      if (from === 'EUR' && to === 'USD') return +(1 / exchangeRateUSDToEUR).toFixed(4);
      // fallback calculated through relative USD rates
      const fromRate = currencies[from].rateToUSD;
      const toRate = currencies[to].rateToUSD;
      return +(fromRate / toRate).toFixed(4);
    }

    function updateView() {
      const src = currencies[sourceKey];
      const tgt = currencies[targetKey];

      // Update Source block
      srcFlag.textContent = src.flag;
      srcCode.textContent = src.code;
      srcBal.textContent = (src.symbol === '$' ? '$' : '') + formatNumber(src.balance) + (src.symbol !== '$' ? ' ' + src.symbol : '');
      srcWallet.textContent = src.walletLabel;

      // Update Target block
      tgtFlag.textContent = tgt.flag;
      tgtCode.textContent = tgt.code;
      tgtBal.textContent = (tgt.symbol === '$' ? '$' : '') + formatNumber(tgt.balance) + (tgt.symbol !== '$' ? ' ' + tgt.symbol : '');
      tgtWallet.textContent = tgt.walletLabel;

      // Rate formula
      const currentRate = getRate(sourceKey, targetKey);
      rateFormulaText.textContent = `1 ${sourceKey} = ${currentRate} ${targetKey}`;

      // Conversion math matching reference (Fee 0.5%)
      const amount = parseFloat(inputAmount.value) || 0;
      const rawConversion = amount * currentRate;
      outputAmount.textContent = formatNumber(rawConversion);

      const feePercent = 0.005;
      const feeVal = rawConversion * feePercent;
      const totalConversion = rawConversion - feeVal;

      detailFee.textContent = `0.5% (${formatNumber(feeVal)} ${targetKey})`;
      detailTotal.textContent = `${formatNumber(totalConversion)} ${targetKey}`;
    }

    // Input listeners
    inputAmount.addEventListener('input', updateView);

    // Swap action with smooth rotation
    btnSwap.addEventListener('click', () => {
      btnSwap.classList.add('rotate-180');
      setTimeout(() => btnSwap.classList.remove('rotate-180'), 300);

      const temp = sourceKey;
      sourceKey = targetKey;
      targetKey = temp;
      updateView();
    });

    // Modal selection handling
    let modalMode = 'source';
    const modal = document.getElementById('currency-modal');
    const modalList = document.getElementById('modal-currency-list');
    const closeModalBtn = document.getElementById('close-modal-btn');

    function openCurrencyModal(mode) {
      modalMode = mode;
      modalList.innerHTML = '';
      Object.keys(currencies).forEach(k => {
        const c = currencies[k];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full flex items-center justify-between p-3 rounded-xl hover:bg-[#1a321d] text-left transition-colors';
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-2xl">${c.flag}</span>
            <div>
              <div class="text-white font-bold">${c.code}</div>
              <div class="text-zinc-400 text-xs">${c.name}</div>
            </div>
          </div>
          <div class="text-brand-sage font-mono text-sm">${c.symbol}${formatNumber(c.balance)}</div>
        `;
        btn.onclick = () => {
          if (modalMode === 'source') {
            if (k === targetKey) targetKey = sourceKey;
            sourceKey = k;
          } else {
            if (k === sourceKey) sourceKey = targetKey;
            targetKey = k;
          }
          closeModal();
          updateView();
        };
        modalList.appendChild(btn);
      });
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    document.getElementById('btn-source-currency').addEventListener('click', () => openCurrencyModal('source'));
    document.getElementById('btn-target-currency').addEventListener('click', () => openCurrencyModal('target'));
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Confirm exchange handler
    btnConfirm.addEventListener('click', () => {
      const amount = parseFloat(inputAmount.value) || 0;
      const rate = getRate(sourceKey, targetKey);
      const feePercent = 0.005;
      const totalToAdd = (amount * rate) * (1 - feePercent);

      if (amount <= 0) {
        alert('Veuillez entrer un montant valide supérieur à 0.');
        return;
      }
      if (amount > currencies[sourceKey].balance) {
        alert(`Solde insuffisant dans votre ${currencies[sourceKey].walletLabel}.`);
        return;
      }

      currencies[sourceKey].balance -= amount;
      currencies[targetKey].balance += totalToAdd;

      toastDesc.textContent = `Conversion de ${formatNumber(amount)} ${sourceKey} en ${formatNumber(totalToAdd)} ${targetKey} finalisée.`;
      toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
      }, 4000);

      updateView();
    });

    // Quick google exchange simulation
    document.getElementById('btn-google-exchange').addEventListener('click', () => {
      btnConfirm.click();
    });

    // Initial setup
    updateView();
  })();
</script>


</body></html>
